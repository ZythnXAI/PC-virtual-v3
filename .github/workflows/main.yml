name: 🚀 NOVA RDP Workstation

on:
  workflow_dispatch:

jobs:

  secure-rdp:

    runs-on: windows-latest
    timeout-minutes: 360


    steps:


    # ==========================
    # OTIMIZAÇÃO DO WINDOWS
    # ==========================

    - name: ⚡ Optimize Workstation
      shell: powershell
      run: |

        powercfg /setactive SCHEME_MIN
        powercfg /hibernate off

        netsh int tcp set global autotuninglevel=normal
        netsh int tcp set global rss=enabled


        # Menos animações

        New-Item `
        "HKCU:\Software\Microsoft\Windows\CurrentVersion\Explorer\VisualEffects" `
        -Force


        Set-ItemProperty `
        "HKCU:\Software\Microsoft\Windows\CurrentVersion\Explorer\VisualEffects" `
        VisualFXSetting `
        2



    # ==========================
    # CONFIGURAR RDP
    # ==========================

    - name: 🖥 Configure RDP
      shell: powershell
      run: |

        $rdp =
        "HKLM:\System\CurrentControlSet\Control\Terminal Server"

        $tcp =
        "$rdp\WinStations\RDP-Tcp"


        Set-ItemProperty `
        $rdp `
        fDenyTSConnections `
        0


        # NLA

        Set-ItemProperty `
        $tcp `
        UserAuthentication `
        1


        # TLS

        Set-ItemProperty `
        $tcp `
        SecurityLayer `
        2



        netsh advfirewall firewall delete rule `
        name="NOVA-RDP"



        netsh advfirewall firewall add rule `
        name="NOVA-RDP" `
        dir=in `
        action=allow `
        protocol=TCP `
        localport=3389



        Restart-Service TermService -Force



    # ==========================
    # USUARIO RDP
    # ==========================


    - name="👤 Create User"
      shell: powershell
      run: |

        $user="RDP"


        if(Get-LocalUser $user `
        -ErrorAction SilentlyContinue){

          Remove-LocalUser $user

        }



        $password =
        -join ((33..126) |
        Get-Random -Count 18 |
        ForEach-Object {[char]$_})



        $secure =
        ConvertTo-SecureString `
        $password `
        -AsPlainText `
        -Force



        New-LocalUser `
        $user `
        -Password $secure `
        -PasswordNeverExpires



        Add-LocalGroupMember `
        Administrators `
        $user



        Add-LocalGroupMember `
        "Remote Desktop Users" `
        $user



        echo "RDP_PASSWORD=$password" >> $env:GITHUB_ENV





    # ==========================
    # TAILSCALE
    # ==========================


    - name: 🌐 Install Tailscale
      shell: powershell
      run: |


        Invoke-WebRequest `
        "https://pkgs.tailscale.com/stable/tailscale-setup-1.82.0-amd64.msi" `
        -OutFile "$env:TEMP\ts.msi"



        Start-Process `
        msiexec.exe `
        -ArgumentList "/i $env:TEMP\ts.msi /quiet" `
        -Wait




    - name: 🔐 Connect Tailscale
      shell: powershell
      run: |


        $ts=
        "$env:ProgramFiles\Tailscale\tailscale.exe"



        & $ts up `
        --authkey=${{ secrets.TAILSCALE_AUTH_KEY }} `
        --hostname=nova-rdp-$env:GITHUB_RUN_ID



        Start-Sleep 10



        $ip =
        & $ts ip -4



        echo "TAILSCALE_IP=$ip" >> $env:GITHUB_ENV




    # ==========================
    # PROGRAMAS
    # ==========================


    - name: 📦 Install Work Apps
      shell: powershell
      run: |


        winget install Google.Chrome `
        --silent `
        --accept-package-agreements `
        --accept-source-agreements



        winget install Discord.Discord `
        --silent `
        --accept-package-agreements `
        --accept-source-agreements



        winget install Microsoft.PowerToys `
        --silent `
        --accept-package-agreements `
        --accept-source-agreements



        winget install 7zip.7zip `
        --silent `
        --accept-package-agreements `
        --accept-source-agreements



        winget install Microsoft.VisualStudioCode `
        --silent `
        --accept-package-agreements `
        --accept-source-agreements




    # ==========================
    # CURSOR LINUX
    # ==========================


    - name: 🖱 Install Linux Cursor
      shell: powershell
      run: |


        mkdir C:\NOVA



        Invoke-WebRequest `
        "https://github.com/ful1e5/Bibata_Cursor/releases/download/v2.0.7/Bibata-Modern-Ice-Windows.zip" `
        -OutFile C:\NOVA\cursor.zip



        Expand-Archive `
        C:\NOVA\cursor.zip `
        C:\NOVA\cursor `
        -Force



        Write-Host "Bibata Linux cursor downloaded"




    # ==========================
    # WALLPAPER
    # ==========================


    - name: 🎨 Anime Desktop
      shell: powershell
      run: |


        mkdir C:\NOVA



        Invoke-WebRequest `
        "https://raw.githubusercontent.com/D3Ext/aesthetic-wallpapers/main/images/girl.jpg" `
        -OutFile C:\NOVA\wallpaper.jpg



        Set-ItemProperty `
        "HKCU:\Control Panel\Desktop" `
        Wallpaper `
        C:\NOVA\wallpaper.jpg



        rundll32.exe user32.dll,UpdatePerUserSystemParameters




    # ==========================
    # INFORMAÇÕES
    # ==========================


    - name: 🚀 RDP ONLINE
      shell: powershell
      run: |


        Write-Host ""
        Write-Host "============================"
        Write-Host " 🚀 NOVA WORKSTATION ONLINE"
        Write-Host "============================"

        Write-Host ""
        Write-Host "IP:"
        Write-Host $env:TAILSCALE_IP

        Write-Host ""
        Write-Host "USER:"
        Write-Host "RDP"

        Write-Host ""
        Write-Host "PASSWORD:"
        Write-Host $env:RDP_PASSWORD



    # ==========================
    # KEEP ALIVE
    # ==========================


    - name: 🔥 Maintain
      shell: powershell
      run: |

        while($true){

          Write-Host "$(Get-Date) NOVA RDP ACTIVE"

          Start-Sleep 300

        }
