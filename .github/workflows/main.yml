name: RDP
on:
  workflow_dispatch:

jobs:
  secure-rdp:
    runs-on: windows-latest
    timeout-minutes: 3600

    steps:
      # ─────────────────────────────────────────────
      # 1. LIBERAR ESPACIO Y MONTAR DISCO EXTRA
      # ─────────────────────────────────────────────
      - name: Free Up Space & Mount Extra Disk
        run: |
          Write-Host "=== Disk before cleanup ===" -ForegroundColor Cyan
          Get-PSDrive -PSProvider FileSystem | Select-Object Name, Used, Free | Format-Table

          $toRemove = @(
            "$env:SystemDrive\hostedtoolcache\windows\Ruby",
            "$env:SystemDrive\hostedtoolcache\windows\go",
            "$env:SystemDrive\hostedtoolcache\windows\Python",
            "$env:ProgramFiles\dotnet",
            "$env:ProgramFiles\MongoDB",
            "$env:ProgramFiles\PostgreSQL",
            "$env:ProgramFiles (x86)\Google\Chrome",
            "$env:ProgramFiles\Mozilla Firefox"
          )
          foreach ($path in $toRemove) {
            if (Test-Path $path) {
              Remove-Item $path -Recurse -Force -ErrorAction SilentlyContinue
              Write-Host "Removed: $path" -ForegroundColor Green
            }
          }

          Write-Host "=== Disk D: info ===" -ForegroundColor Cyan
          Get-PSDrive D -ErrorAction SilentlyContinue

          $vhdPath = "D:\extra_disk.vhdx"
          New-VHD -Path $vhdPath -SizeBytes 100GB -Dynamic -ErrorAction SilentlyContinue
          Mount-VHD -Path $vhdPath
          $disk = Get-Disk | Where-Object { $_.OperationalStatus -eq 'Online' -and $_.PartitionStyle -eq 'RAW' } | Select-Object -Last 1
          if ($disk) {
            Initialize-Disk -Number $disk.Number -PartitionStyle MBR -PassThru |
              New-Partition -AssignDriveLetter -UseMaximumSize |
              Format-Volume -FileSystem NTFS -NewFileSystemLabel "ExtraDisk" -Confirm:$false
          }

          Write-Host "=== Disk after setup ===" -ForegroundColor Cyan
          Get-PSDrive -PSProvider FileSystem | Select-Object Name, Used, Free | Format-Table

          "EXTRA_DISK=E:" | Out-File -FilePath $env:GITHUB_ENV -Append
          "STORAGE_ROOT=D:\storage" | Out-File -FilePath $env:GITHUB_ENV -Append
          New-Item -ItemType Directory -Force -Path "D:\storage" | Out-Null

      # ─────────────────────────────────────────────
      # 2. CONFIGURAR RDP
      # ─────────────────────────────────────────────
      - name: Configure RDP Settings
        run: |
          Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server' `
            -Name "fDenyTSConnections" -Value 0 -Force
          Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server\WinStations\RDP-Tcp' `
            -Name "UserAuthentication" -Value 0 -Force
          Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server\WinStations\RDP-Tcp' `
            -Name "SecurityLayer" -Value 0 -Force

          netsh advfirewall firewall delete rule name="RDP-Tailscale" 2>$null
          netsh advfirewall firewall add rule name="RDP-Tailscale" `
            dir=in action=allow protocol=TCP localport=3389

          Restart-Service -Name TermService -Force
          Write-Host "RDP configured." -ForegroundColor Green

      # ─────────────────────────────────────────────
      # 3. CREAR USUARIO RDP
      # ─────────────────────────────────────────────
      - name: Create RDP User
        run: |
          $charSet = @{
            Upper   = [char[]](65..90)
            Lower   = [char[]](97..122)
            Number  = [char[]](48..57)
            Special = [char[]]@(33,35,36,37,38,42,43,45,61,64)
          }
          $rawPassword  = @()
          $rawPassword += $charSet.Upper   | Get-Random -Count 4
          $rawPassword += $charSet.Lower   | Get-Random -Count 4
          $rawPassword += $charSet.Number  | Get-Random -Count 4
          $rawPassword += $charSet.Special | Get-Random -Count 4
          $password = -join ($rawPassword | Sort-Object { Get-Random })

          $securePass = ConvertTo-SecureString $password -AsPlainText -Force
          New-LocalUser -Name "RDP" -Password $securePass -AccountNeverExpires -ErrorAction SilentlyContinue
          Add-LocalGroupMember -Group "Administrators"        -Member "RDP" -ErrorAction SilentlyContinue
          Add-LocalGroupMember -Group "Remote Desktop Users"  -Member "RDP" -ErrorAction SilentlyContinue

          if (-not (Get-LocalUser -Name "RDP" -ErrorAction SilentlyContinue)) {
            Write-Error "User creation failed"; exit 1
          }

          "RDP_PASSWORD=$password" | Out-File -FilePath $env:GITHUB_ENV -Append
          Write-Host "RDP user created." -ForegroundColor Green

      # ─────────────────────────────────────────────
      # 4. INSTALAR CURSOR ESTILO macOS
      # ─────────────────────────────────────────────
      - name: Install macOS Style Cursor
        run: |
          Write-Host "=== Installing macOS Style Cursor ===" -ForegroundColor Cyan

          $cursorUrl = "https://github.com/ful1e5/apple_cursor/releases/download/v2.0.1/macOS-Windows.zip"
          $zipFile   = "$env:TEMP\macOS-Windows.zip"
          $extractDir = "$env:TEMP\macOS-Windows"

          # Download cursor pack
          try {
            Invoke-WebRequest -Uri $cursorUrl -OutFile $zipFile -UseBasicParsing -MaximumRedirection 5
            Write-Host "Cursor pack downloaded successfully." -ForegroundColor Green
          } catch {
            Write-Error "Failed to download cursor pack: $_"; exit 1
          }

          # Extract
          if (Test-Path $extractDir) { Remove-Item $extractDir -Recurse -Force }
          Expand-Archive -Path $zipFile -DestinationPath $extractDir -Force

          # Find the actual cursor folder (may be nested)
          $cursorSource = Get-ChildItem -Path $extractDir -Recurse -Filter "*.cur" | Select-Object -First 1
          if (-not $cursorSource) {
            Write-Error "No .cur files found in the downloaded package."
            Get-ChildItem -Path $extractDir -Recurse | Format-Table
            exit 1
          }
          $cursorFolder = $cursorSource.DirectoryName
          Write-Host "Cursor files found in: $cursorFolder" -ForegroundColor Green

          # Create system cursor directory
          $cursorDest = "C:\Windows\Cursors\macOS"
          New-Item -ItemType Directory -Path $cursorDest -Force | Out-Null
          Copy-Item -Path "$cursorFolder\*" -Destination $cursorDest -Recurse -Force
          Write-Host "Cursors copied to: $cursorDest" -ForegroundColor Green

          # Helper function to set cursor registry values
          function Set-CursorRegistry {
            param([string]$RegPath)
            $cursorMap = @{
              "Arrow"       = "Arrow.cur"
              "Help"        = "Help.cur"
              "AppStarting" = "AppStarting.ani"
              "Wait"        = "Wait.ani"
              "Crosshair"   = "Cross.cur"
              "IBeam"       = "IBeam.cur"
              "NWPen"       = "NWPen.cur"
              "No"          = "No.cur"
              "SizeNS"      = "SizeNS.cur"
              "SizeWE"      = "SizeWE.cur"
              "SizeNWSE"    = "SizeNWSE.cur"
              "SizeNESW"    = "SizeNESW.cur"
              "SizeAll"     = "SizeAll.cur"
              "UpArrow"     = "UpArrow.cur"
              "Hand"        = "Hand.cur"
              "Person"      = "Person.cur"
              "Pin"         = "Pin.cur"
            }
            foreach ($key in $cursorMap.Keys) {
              $filePath = Join-Path $cursorDest $cursorMap[$key]
              if (Test-Path $filePath) {
                Set-ItemProperty -Path $RegPath -Name $key -Value $filePath -Force -ErrorAction SilentlyContinue
              }
            }
            Set-ItemProperty -Path $RegPath -Name "(Default)" -Value "macOS Cursors" -Force -ErrorAction SilentlyContinue
          }

          # Apply to DEFAULT profile (so new users like RDP inherit it)
          $defaultPath = "Registry::HKEY_USERS\.DEFAULT\Control Panel\Cursors"
          Set-CursorRegistry -RegPath $defaultPath
          Write-Host "Cursor theme applied to DEFAULT user profile." -ForegroundColor Green

          # Apply to current user profile as well
          $currentPath = "HKCU:\Control Panel\Cursors"
          Set-CursorRegistry -RegPath $currentPath
          Write-Host "Cursor theme applied to current user profile." -ForegroundColor Green

          # Force system to refresh cursor settings
          rundll32.exe user32.dll,UpdatePerUserSystemParameters
          Start-Sleep -Seconds 2
          # Also broadcast a settings change message
          Add-Type @"
            using System; using System.Runtime.InteropServices;
            public class CursorUpdate {
              [DllImport("user32.dll", SetLastError = true)]
              public static extern bool SystemParametersInfo(uint uiAction, uint uiParam, string pvParam, uint fWinIni);
            }
"@
          [CursorUpdate]::SystemParametersInfo(0x2029, 0, $null, 0x01 -bor 0x02) | Out-Null
          [CursorUpdate]::SystemParametersInfo(0x202A, 0, $null, 0x01 -bor 0x02) | Out-Null

          Write-Host "=== macOS Cursor installed successfully! ===" -ForegroundColor Green

      # ─────────────────────────────────────────────
      # 5. INSTALAR TAILSCALE
      # ─────────────────────────────────────────────
      - name: Install Tailscale
        run: |
          $tsUrl = "https://pkgs.tailscale.com/stable/tailscale-setup-1.82.0-amd64.msi"
          $installer = "$env:TEMP\tailscale.msi"
          Invoke-WebRequest -Uri $tsUrl -OutFile $installer -UseBasicParsing
          Start-Process msiexec.exe -ArgumentList "/i","`"$installer`"","/quiet","/norestart" -Wait
          Remove-Item $installer -Force

      # ─────────────────────────────────────────────
      # 6. CONECTAR TAILSCALE
      # ─────────────────────────────────────────────
      - name: Connect Tailscale
        run: |
          $ts = "$env:ProgramFiles\Tailscale\tailscale.exe"
          & $ts up --authkey=${{ secrets.TAILSCALE_AUTH_KEY }} --hostname=gh-runner-$env:GITHUB_RUN_ID

          $tsIP = $null
          $retries = 0
          while (-not $tsIP -and $retries -lt 15) {
            Start-Sleep -Seconds 4
            $tsIP = & $ts ip -4 2>$null
            $retries++
          }

          if (-not $tsIP) { Write-Error "Tailscale IP not assigned."; exit 1 }
          "TAILSCALE_IP=$tsIP" | Out-File -FilePath $env:GITHUB_ENV -Append
          Write-Host "Tailscale IP: $tsIP" -ForegroundColor Green

      # ─────────────────────────────────────────────
      # 7. VERIFICAR RDP
      # ─────────────────────────────────────────────
      - name: Verify RDP
        run: |
          $test = Test-NetConnection -ComputerName $env:TAILSCALE_IP -Port 3389
          if (-not $test.TcpTestSucceeded) {
            Write-Error "RDP port 3389 not reachable"; exit 1
          }
          Write-Host "RDP reachable on port 3389 ✓" -ForegroundColor Green

      # ─────────────────────────────────────────────
      # 8. VERIFICAR APLICACIONES INSTALADAS
      # ─────────────────────────────────────────────
      - name: Verify Installed Apps
        run: |
          Write-Host ""
          Write-Host "╔══════════════════════════════════════════════════╗" -ForegroundColor Cyan
          Write-Host "║         VERIFICATION REPORT                      ║" -ForegroundColor Cyan
          Write-Host "╠══════════════════════════════════════════════════╣" -ForegroundColor Cyan

          Write-Host "║  NODE.JS:" -NoNewline
          try { node --version 2>$null; Write-Host " ✓" -ForegroundColor Green } catch { Write-Host " ✗" -ForegroundColor Red }

          Write-Host "║  NPM:    " -NoNewline
          try { npm --version 2>$null; Write-Host " ✓" -ForegroundColor Green } catch { Write-Host " ✗" -ForegroundColor Red }

          Write-Host "║  CURSOR: " -NoNewline
          $c = Get-ItemProperty -Path "HKCU:\Control Panel\Cursors" -Name "(Default)" -ErrorAction SilentlyContinue
          if ($c.'(Default)' -like "*macOS*") { Write-Host " ✓ macOS Style" -ForegroundColor Green } else { Write-Host " ✗" -ForegroundColor Red }

          Write-Host "╚══════════════════════════════════════════════════╝" -ForegroundColor Cyan
          Write-Host ""

      # ─────────────────────────────────────────────
      # 9. MANTENER SESIÓN ACTIVA
      # ─────────────────────────────────────────────
      - name: Keep Alive & Show Credentials
        run: |
          Write-Host ""
          Write-Host "╔══════════════════════════════════════════════════╗" -ForegroundColor Cyan
          Write-Host "║         RDP ACCESS INFO                          ║" -ForegroundColor Cyan
          Write-Host "╠══════════════════════════════════════════════════╣" -ForegroundColor Cyan
          Write-Host "║  IP:       $env:TAILSCALE_IP"
          Write-Host "║  User:     RDP"
          Write-Host "║  Password: $env:RDP_PASSWORD"
          Write-Host "╠══════════════════════════════════════════════════╣" -ForegroundColor Cyan
          Write-Host "║  FEATURES                                        ║" -ForegroundColor Cyan
          Write-Host "║  • macOS Style Mouse Cursor                      ║"
          Write-Host "╠══════════════════════════════════════════════════╣" -ForegroundColor Cyan
          Write-Host "║  STORAGE                                         ║" -ForegroundColor Cyan
          Write-Host "║  C: ~14GB (sistema)                              ║"
          Write-Host "║  D: ~70GB (runner disk)                          ║"
          Write-Host "║  E: ~100GB (VHD extra)                           ║"
          Write-Host "╚══════════════════════════════════════════════════╝" -ForegroundColor Cyan
          Write-Host ""

          # Mantener la sesión activa
          $i = 0
          while ($true) {
            Start-Sleep -Seconds 60
            $i++
            Write-Host "Keep alive... ($i minutos)" -ForegroundColor DarkGray
          }

