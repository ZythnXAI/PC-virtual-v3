name: RDP

on:
  workflow_dispatch:

jobs:
  secure-rdp:
    runs-on: windows-2025
    timeout-minutes: 3600

    steps:
      - name: Configure RDP
        shell: powershell
        run: |
          # Habilita Remote Desktop
          Set-ItemProperty `
            -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server' `
            -Name 'fDenyTSConnections' `
            -Value 0 `
            -Force

          # Mantém Network Level Authentication (NLA) habilitado
          Set-ItemProperty `
            -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server\WinStations\RDP-Tcp' `
            -Name 'UserAuthentication' `
            -Value 1 `
            -Force

          # TLS para RDP
          Set-ItemProperty `
            -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server\WinStations\RDP-Tcp' `
            -Name 'SecurityLayer' `
            -Value 1 `
            -Force

          # Regra do Firewall do Windows
          Enable-NetFirewallRule -DisplayGroup 'Remote Desktop'

          Restart-Service TermService -Force

      - name: Create RDP User
        shell: powershell
        run: |
          $password = -join (
            ((48..57) + (65..90) + (97..122)) |
            Get-Random -Count 24 |
            ForEach-Object { [char]$_ }
          )

          $securePassword = ConvertTo-SecureString `
            $password `
            -AsPlainText `
            -Force

          if (Get-LocalUser -Name 'RDP' -ErrorAction SilentlyContinue) {
            Set-LocalUser -Name 'RDP' -Password $securePassword
          }
          else {
            New-LocalUser `
              -Name 'RDP' `
              -Password $securePassword `
              -AccountNeverExpires
          }

          Add-LocalGroupMember `
            -Group 'Remote Desktop Users' `
            -Member 'RDP' `
            -ErrorAction SilentlyContinue

          "RDP_USERNAME=RDP" >> $env:GITHUB_ENV
          "RDP_PASSWORD=$password" >> $env:GITHUB_ENV

      - name: Show RDP information
        shell: powershell
        run: |
          Write-Host "===== RDP ====="
          Write-Host "Username: $env:RDP_USERNAME"
          Write-Host "Password: $env:RDP_PASSWORD"
          Write-Host "==============="

      - name: Keep runner alive
        shell: powershell
        run: |
          while ($true) {
            Write-Host "RDP runner ativo: $(Get-Date)"
            Start-Sleep -Seconds 300
          }
